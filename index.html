<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR 实景文旅地图</title>
<script>
// ① 点位配置：填写 WGS84 十进制度坐标，经度在前。以下为上海外滩一带的示例点。
const VENUES=["新华日报旧址","红岩村","周公馆"];
const themes=["报纸印记","联络信物","书信档案"];
const descriptions=["停下来观察版面与报头，寻找报纸上的时代印记。","在指定停留点观察信物，阅读与附近展陈有关的介绍。","观察书信的书写与保存方式，结合现场介绍理解它的用途。"];
const key="cq-walking-guide-v1";
let site=0, routes=VENUES.map((v,i)=>({points:["入口","转向点",themes[i]].map((name,j)=>({name,kind:["入口","转向","体验"][j],latitude:null,longitude:null,description:j===2?descriptions[i]:"",color:"#236e65",photo:""})),base:null}));
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.length===3)routes=saved;site=Math.min(2,Math.max(0,Number(sessionStorage.getItem(key))||0))}catch{}
let PLACES=routes[site].points, goal=0,step=0;
</script>
<script defer src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script defer src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#152b2c;color:white;font:16px/1.55 system-ui,sans-serif}a-scene{position:fixed!important;inset:0;z-index:0}#intro,dialog,footer,#arrival,#quit,#message{position:fixed;z-index:4}#intro{inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#345854,#112525)}article,dialog{max-width:380px;background:#f8faf4;color:#173633;border:0;border-radius:18px;padding:24px}h1,h2{margin:0}button{font:inherit;padding:9px 18px;cursor:pointer;border-radius:9px;border:0;background:#12685b;color:white}footer{bottom:0;left:0;right:0;background:#102624ed;padding:12px 8px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;text-align:center}footer span{display:block;font-size:13px;color:#cadbd5}#arrival,#message{left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;background:#123d36ee;padding:8px 14px;border-radius:10px}#arrival{top:58px}#message{bottom:76px;font-size:14px}#quit{top:12px;right:12px}dialog{inset:0;margin:auto;width:85%;height:fit-content}dialog::backdrop{background:#0008}[hidden]{display:none!important}
#intro{display:block;overflow:auto;padding:16px;background:#e9ece4}#intro article{margin:auto;max-width:500px;border-top:5px solid #96533f;box-shadow:0 8px 26px #26443718}#intro small{letter-spacing:.15em;color:#755641}#map{display:block;background:#e3ece3;width:100%;margin-top:12px;border-radius:12px}#intro label{display:block;margin:7px 0}input,textarea,select{font:inherit;padding:6px;border:1px solid #a7bbb2;border-radius:6px;max-width:100%}input,textarea{width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{margin:3px 0;padding:8px 12px}button:disabled{opacity:.45}summary{cursor:pointer;color:#714d3d;font-weight:650}details{margin:14px 0}dialog img{width:100%;max-height:40vh;object-fit:contain}#mapInfo,#saved,#error{font-size:13px}dialog{max-height:80vh;overflow:auto}model-viewer{width:100%;height:260px;background:#dfebe6;border-radius:12px;display:block}#modelStatus{font-size:13px}#detail{width:min(92vw,540px)}#map{touch-action:none;cursor:grab;user-select:none}#map:active{cursor:grabbing}#cameraInfo{letter-spacing:0!important}nav button{min-width:42px}</style></head><body>
<div id="intro"><article><small>重庆 · 实景文旅导览</small><h1>三地寻访地图</h1><select id="venue"></select>
<svg id="map" viewBox="0 0 360 210" aria-label="点位与实时位置地图"></svg><nav aria-label="地图视图"><button id="minus" aria-label="缩小地图">−</button> <button id="plus" aria-label="放大地图">＋</button> <button id="whole">景区全图</button> <button id="here">我的位置</button></nav><small id="cameraInfo"></small><p id="mapInfo"></p>
<label>前往 <select id="dest"></select></label><p><button id="loc">GPS 定位</button> <button id="start" disabled>开始 AR 指引</button> <button id="view">景观介绍</button></p><p id="error" role="status"></p>
<details><summary>配置景区点位与路线</summary><p>按实际通行顺序录入 WGS84 经纬度。在每个转弯处加点，只有连续录入的路段才能开启 AR。</p>
<form id="edit"><label>编辑点位 <select id="editPoint"></select></label><button type="button" id="add">新增下一点</button>
<label>名称<input id="name" required maxlength="40"></label><label>类型<select id="kind"><option>入口</option><option>转向</option><option>景观</option><option>体验</option><option>下一站</option></select></label>
<div class="pair"><label>经度（度）<input id="lng" required type="number" min="0" max="180" step="any"></label><label>经度方向<select id="lngDir"><option value="1">东经 E</option><option value="-1">西经 W</option></select></label>
<label>纬度（度）<input id="lat" required type="number" min="0" max="85" step="any"></label><label>纬度方向<select id="latDir"><option value="1">北纬 N</option><option value="-1">南纬 S</option></select></label></div>
<label>讲解<textarea id="desc"></textarea></label><label>景观照片<input id="photo" type="file" accept="image/*"></label><button>保存点位</button> <button type="button" id="anchorSettings">锚点三维地图设置</button></form>
<details><summary>上传景区底图</summary><form id="baseForm"><p>使用上北下南的平面图，填写四边对应的 WGS84 经纬度。</p><input id="baseFile" type="file" accept="image/*" required><div class="pair" id="bounds"></div><button>保存底图</button></form></details><p id="saved" role="status"></p></details>
</article></div>
<p id="arrival" hidden role="status"></p><p id="message" hidden role="status"></p><button id="quit" hidden>退出</button>
<footer hidden><div><span>GPS 精度</span><b id="acc">—</b></div><div><span>镜头朝向</span><b id="heading">—</b></div><div><span>最近点位</span><b id="near">—</b></div></footer>
<dialog id="detail"><h2 id="title"></h2><img id="picture" hidden alt="点位景观照片"><p id="text"></p><section><h3>锚点三维地图</h3><div id="modelBox"></div><p id="modelStatus" role="status"></p><label>设置锚点模型（GLB）<input type="file" id="modelInput" accept=".glb,model/gltf-binary"></label></section><button id="close">关闭讲解</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), rad=Math.PI/180;
function message(text){$('message').textContent=text;$('message').hidden=!text}
// ② 地表距离用于 HUD 和到达判定，避免把墨卡托投影单位当作真实米数。
function metres(a,b){
 const dLat=(b.latitude-a.latitude)*rad,dLon=(b.longitude-a.longitude)*rad;
 const h=Math.sin(dLat/2)**2+Math.cos(a.latitude*rad)*Math.cos(b.latitude*rad)*Math.sin(dLon/2)**2;
 return 12742000*Math.asin(Math.sqrt(Math.min(1,h)));
}
let fix=null,registered=false,watch=null,timer,scene,cam,readyGPS=false,headingKnown=false,videoReady=false;
const inside=new Set();
function gps(p){
 fix=p.coords;$('acc').textContent='±'+Math.round(fix.accuracy)+' 米';
 const rows=PLACES.slice(0,goal+1).map((place,i)=>({place,i,d:metres(fix,place)})).sort((a,b)=>a.d-b.d);
 $('near').textContent=Math.round(rows[0].d)+' 米';$('near').title=rows[0].place.name;
 const arrived=[];let scenic=null;
 for(const {i,d,place} of rows){
  if(d<=50&&!inside.has(i)){inside.add(i);arrived.push(place.name);if(!scenic&&place.photo&&['体验','景观','下一站'].includes(place.kind))scenic=place}
  if(d>60)inside.delete(i); // 离开 60 米才重置，减少边界附近的重复提示。
 }
 if(scenic&&!$('detail').open)showPlace(scenic);
 if(arrived.length){$('arrival').textContent='已到达：'+arrived.join('、');$('arrival').hidden=false;
  clearTimeout(timer);timer=setTimeout(()=>$('arrival').hidden=true,6000)}
 if(step<goal && metres(fix,PLACES[step])<=12 && fix.accuracy<=25)step++;
 feedback();
}
function feedback(){
 if(!videoReady)videoReady=Array.from(document.querySelectorAll('video')).some(v=>v.readyState>=2&&v.videoWidth>0);
 if(!videoReady){message('等待相机画面，请允许相机访问');return}
 if(!fix||!readyGPS){message('等待卫星定位，请到开阔处');return}
 if(!headingKnown){message('等待绝对朝向，请竖持手机并缓慢转动');return}
 const nearest=Math.min(...PLACES.slice(0,goal+1).map(p=>metres(fix,p)));
 message(nearest>5000?'附近 5 公里内暂无配置点位':fix.accuracy>25?'定位误差较大，请对照现场道路':('前往 '+PLACES[step].name+' · '+Math.round(metres(fix,PLACES[step]))+' 米'));
}
// ③ projected 实体使用原生组件存储坐标。通过新相机的投影 API 显式绑定到同一世界原点。
function register(){
 if(registered)return;registered=true;
 AFRAME.registerComponent('road-arrows',{
  init(){
   this.direction=new THREE.Vector3();this.arrows=Array.from({length:5},()=>{
    const arrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,-1),new THREE.Vector3(),2.8,0xffbc47,1.4,.95);
    this.el.object3D.add(arrow);return arrow;
   });
  },
  tick(){
   const gpsCam=cam?.components['gps-new-camera'];
   this.arrows.forEach(a=>a.visible=false);
   if(!readyGPS||!fix||!gpsCam||goal===0)return;
   const end=Math.max(1,step),a=PLACES[end-1],b=PLACES[end];
   const [ax,az]=gpsCam.latLonToWorld(a.latitude,a.longitude),[bx,bz]=gpsCam.latLonToWorld(b.latitude,b.longitude);
   const dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz);if(!(len>1))return;
   const [x,z]=gpsCam.latLonToWorld(fix.latitude,fix.longitude);
   const along=Math.max(0,Math.min(len,((x-ax)*dx+(z-az)*dz)/len));
   if(Math.hypot(x-ax-dx*along/len,z-az-dz*along/len)>45)return;
   this.arrows.forEach((arrow,i)=>{const d=along+2+i*5;if(d>=len)return;
    arrow.visible=true;arrow.position.set(ax+dx*d/len,cam.object3D.position.y-1.3,az+dz*d/len);
    arrow.setDirection(this.direction.set(dx/len,0,dz/len));
   });
  }
 });
 AFRAME.registerComponent('tour-label',{
  schema:{index:{type:'int'}},
  init(){
   const place=PLACES[this.data.index],canvas=document.createElement('canvas');
   canvas.width=1024;canvas.height=192;
   const g=canvas.getContext('2d');g.fillStyle=place.color;g.fillRect(0,0,1024,192);
   g.fillStyle='white';g.textBaseline='middle';g.textAlign='center';g.font='bold 82px system-ui,sans-serif';
   g.fillText(place.name,512,96,960);
   // CanvasTexture 使用系统中文字体，标签本身就是可被射线命中的 3D 平面。
   const tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;
   this.mesh=new THREE.Mesh(new THREE.PlaneGeometry(4,0.75),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
   this.el.setObject3D('mesh',this.mesh);this.el.object3D.visible=false;
   if(place.kind==='体验'){
    const geometry=site===1?new THREE.OctahedronGeometry(.6):new THREE.BoxGeometry(1.4,.9,.12);
    this.prop=new THREE.Mesh(geometry,new THREE.MeshNormalMaterial());
    this.prop.position.y=1;this.mesh.add(this.prop);
   }
   this.el.addEventListener('click',()=>{if(!this.el.object3D.visible)return;
    showPlace(place)});
  },
  tick(){
   const camera=cam?.components['gps-new-camera'],obj=this.el.object3D,place=this.el.components['gps-projected-entity-place']?.data;
   if(!camera||!place||!fix||!readyGPS){obj.visible=false;return}
   const distance=metres(fix,place);obj.visible=distance<=5000;if(!obj.visible)return;
   const [x,z]=camera.latLonToWorld(place.latitude,place.longitude);
   if(!Number.isFinite(x)||!Number.isFinite(z)){obj.visible=false;return}
   obj.position.set(x,cam.object3D.position.y+0.3,z);
   // 到达点位中心时给标签保留近景展示距离，避免进入镜头近裁剪面。
   if(distance<1){
    const direction=scene.camera.getWorldDirection(this.dir||(this.dir=new THREE.Vector3()));
    obj.position.copy(cam.object3D.position).addScaledVector(direction,3);
   }
   const scale=Math.max(0.22,Math.hypot(x-cam.object3D.position.x,z-cam.object3D.position.z)*0.045);
   obj.scale.setScalar(scale);obj.quaternion.copy(scene.camera.getWorldQuaternion(this.q||(this.q=new THREE.Quaternion())));
  },
  remove(){this.mesh.material.map.dispose();this.mesh.material.dispose();this.mesh.geometry.dispose()}
 });
}
// ④ 仅接受能确定北向的数据。相对 alpha 的零点由设备自行决定。
function orientation(e){
 let h;
 if(Number.isFinite(e.webkitCompassHeading)&&e.webkitCompassHeading>=0)h=e.webkitCompassHeading;
 else if((e.absolute||e.type==='deviceorientationabsolute')&&Number.isFinite(e.alpha)){
  const a=e.alpha*rad,b=(e.beta||0)*rad,g=(e.gamma||0)*rad;
  const east=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g);
  const north=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
  if(Math.hypot(east,north)<0.05)return;h=Math.atan2(east,north)/rad;
 }else return;
 headingKnown=true;$('heading').textContent=(Math.round((h+360)%360)%360)+'°';feedback();
}
function run(){
 window.addEventListener('deviceorientationabsolute',orientation);window.addEventListener('deviceorientation',orientation);
 window.addEventListener('gps-camera-update-position',()=>{readyGPS=true;feedback()});
 window.addEventListener('camera-init',()=>{videoReady=true;feedback()});
 window.addEventListener('camera-error',()=>message('相机启动失败。请检查网站权限，然后退出并重试。'));
 scene=document.createElement('a-scene');scene.setAttribute('vr-mode-ui','enabled:false');
 scene.setAttribute('device-orientation-permission-ui','enabled:false');
 scene.setAttribute('renderer','alpha:true;antialias:true');scene.setAttribute('arjs','sourceType:webcam;videoTexture:true;debugUIEnabled:false');
 scene.setAttribute('cursor','rayOrigin:mouse;fuse:false');scene.setAttribute('raycaster','objects:.tour-point');
 cam=document.createElement('a-camera');cam.setAttribute('gps-new-camera','gpsMinDistance:0;gpsMinAccuracy:100');
 cam.setAttribute('wasd-controls','enabled:false');cam.setAttribute('camera','near:0.05;far:20000');scene.append(cam);
 PLACES.slice(0,goal+1).forEach((p,i)=>{const tag=document.createElement('a-entity');tag.className='tour-point';
  tag.setAttribute('gps-projected-entity-place','latitude:'+p.latitude+';longitude:'+p.longitude);
  tag.setAttribute('tour-label','index:'+i);scene.append(tag)});
 const arrow=document.createElement('a-entity');arrow.setAttribute('road-arrows','');scene.append(arrow);
 document.body.append(scene);
 // 单独的只读订阅取得浏览器报告的精度；AR.js 的位置事件在部分构建中只携带经纬度。
 watch=navigator.geolocation.watchPosition(gps,e=>{fix=null;$('acc').textContent='—';$('near').textContent='—';message(e.code===1?'定位权限被拒绝，请在网站设置中允许访问':'暂时无法定位，请到开阔处重试')},{enableHighAccuracy:true,maximumAge:0,timeout:18000});
 $('intro').hidden=true;$('quit').hidden=false;document.querySelector('footer').hidden=false;feedback();
}
let mapWatch=null,mapFix=null, viewport=null, projection=null, follow=false;
const pointers=new Map();let multi=false,dragged=false,press;
function adjust(factor,from,to){
 const {cx,cy,k,scale,unit}=projection;
 const zoom=Math.max(.25,Math.min(128,scale/unit*factor)),next=zoom*unit;
 viewport={cx:cx+(from.x-180)/(k*scale)-(to.x-180)/(k*next),
 cy:Math.max(-85,Math.min(85,cy-(from.y-105)/scale+(to.y-105)/next)),scale:next,unit};
 follow=false;mapDraw();
}
const middle={x:180,y:105};
$('plus').onclick=()=>adjust(1.5,middle,middle);$('minus').onclick=()=>adjust(1/1.5,middle,middle);
$('whole').onclick=()=>{viewport=null;follow=false;mapDraw()};
function centerGPS(){if(!mapFix)return;const unit=projection.unit;
 viewport={cx:mapFix.longitude,cy:mapFix.latitude,scale:Math.min(unit*128,Math.max(unit,100000)),unit};mapDraw()}
$('here').onclick=()=>{follow=true;if(mapFix)centerGPS();else if(mapWatch===null)$('loc').click();else $('mapInfo').textContent='正在等待 GPS 定位…'};
const surface=$('map');
function pointerXY(e){const r=surface.getBoundingClientRect();return {x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*210/r.height}}
function gesture(){const [a,b]=pointers.values();return b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}:{...a,d:0}}
surface.addEventListener('pointerdown',e=>{
 if(pointers.size>=2)return;
 pointers.set(e.pointerId,pointerXY(e));
 if(pointers.size===1){press=pointerXY(e);multi=false;dragged=false}else multi=true;
 // 轻点锚点时保留其点击事件；开始拖动后再捕获指针。
 if(!e.target.closest('[role=button]'))surface.setPointerCapture(e.pointerId);
});
surface.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const prev=gesture(),pos=pointerXY(e);
 if(!dragged&&!multi&&Math.hypot(pos.x-press.x,pos.y-press.y)<3)return;
 surface.setPointerCapture(e.pointerId);dragged=true;pointers.set(e.pointerId,pos);
 const next=gesture();adjust(prev.d>1&&next.d>1?next.d/prev.d:1,prev,next);
});
for(const type of ['pointerup','pointercancel'])window.addEventListener(type,e=>pointers.delete(e.pointerId));
surface.addEventListener('click',e=>{if(e.detail&&(dragged||multi)){e.stopImmediatePropagation();e.preventDefault()}},true);
surface.addEventListener('wheel',e=>{e.preventDefault();const pos=pointerXY(e);adjust(Math.exp(-Math.sign(e.deltaY)*.2),pos,pos)},{passive:false});
const configured=p=>Number.isFinite(p.latitude)&&Number.isFinite(p.longitude);
function showPlace(p){
 openAnchor(site,PLACES.indexOf(p));
 $('title').textContent=p.name;$('text').textContent=p.description||'该点位的讲解待补充。';
 $('picture').hidden=!p.photo;if(p.photo)$('picture').src=p.photo;else $('picture').removeAttribute('src');
 if(!$('detail').open)$('detail').showModal();
}
function signed(id){return $(id).valueAsNumber*Number($(id+'Dir').value)}
function options(id,names,index){$(id).replaceChildren(...names.map((n,i)=>new Option(n,String(i))));$(id).selectedIndex=index}
$('anchorSettings').onclick=()=>showPlace(PLACES[$('editPoint').selectedIndex]);
function fields(){
 const p=PLACES[$('editPoint').selectedIndex];$('name').value=p.name;$('kind').value=p.kind;
 $('lng').value=p.longitude==null?'':Math.abs(p.longitude);$('lat').value=p.latitude==null?'':Math.abs(p.latitude);$('lngDir').value=p.longitude<0?'-1':'1';$('latDir').value=p.latitude<0?'-1':'1';$('desc').value=p.description;$('photo').value='';
}
function list(edit=0){
 options('dest',PLACES.map(p=>p.name),goal);options('editPoint',PLACES.map((p,i)=>(i+1)+'. '+p.name),edit);fields();mapDraw();
}
function mapDraw(){
 const svg=$('map');svg.replaceChildren();
 function node(tag,attrs,txt){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);
 if(txt)n.textContent=txt;svg.append(n);return n}
 const base=routes[site].base,items=PLACES.filter(configured);
 const extent=items.slice();if(mapFix&&!items.length&&!base)extent.push(mapFix);
 if(base)extent.push({longitude:base.w,latitude:base.s},{longitude:base.e,latitude:base.n});
 const autoX=extent.length?(Math.min(...extent.map(p=>p.longitude))+Math.max(...extent.map(p=>p.longitude)))/2:0;
 const autoY=extent.length?(Math.min(...extent.map(p=>p.latitude))+Math.max(...extent.map(p=>p.latitude)))/2:0;
 const fit=Math.min(145/Math.max(.0004,...extent.map(p=>Math.abs(p.longitude-autoX)*Math.cos(autoY*rad))),76/Math.max(.0004,...extent.map(p=>Math.abs(p.latitude-autoY))));
 const {cx,cy,scale,unit}=viewport||{cx:extent.length?autoX:106.54,cy:extent.length?autoY:29.56,scale:fit,unit:fit};
 const k=Math.cos(cy*rad);projection={cx,cy,scale,unit,k};
 $('cameraInfo').textContent='↑ 北　'+(scale/unit).toFixed(1)+'×　中心 '+Math.abs(cx).toFixed(5)+(cx<0?'°W':'°E')+' / '+Math.abs(cy).toFixed(5)+(cy<0?'°S':'°N');
 const X=v=>180+(v-cx)*k*scale,Y=v=>105-(v-cy)*scale;
 if(base)node('image',{href:base.img,x:X(base.w),y:Y(base.n),width:X(base.e)-X(base.w),height:Y(base.s)-Y(base.n),preserveAspectRatio:'none'});
 else {
 const step=10**Math.round(Math.log10(28/scale));
 for(let x=(X(0)%(step*k*scale));x<360;x+=step*k*scale)node('path',{d:'M'+x+' 0v210',stroke:'#cfdbd1'});
 for(let y=(Y(0)%(step*scale));y<210;y+=step*scale)node('path',{d:'M0 '+y+'h360',stroke:'#cfdbd1'});
 }
 PLACES.forEach((p,i)=>{if(!configured(p))return;const q=PLACES[i-1];if(q&&configured(q))node('line',{x1:X(q.longitude),y1:Y(q.latitude),x2:X(p.longitude),y2:Y(p.latitude),stroke:i<=goal?'#96533f':'#899d91','stroke-width':3})});
 PLACES.forEach((p,i)=>{if(!configured(p))return;const x=X(p.longitude),y=Y(p.latitude);
 if(x< -8||x>368||y< -8||y>218)return;
 const dot=node('circle',{cx:x,cy:y,r:i===goal?9:6,fill:'#8d4334',stroke:'white',tabindex:0,role:'button','aria-label':p.name});
 dot.onclick=()=>{goal=i;$('dest').selectedIndex=i;mapDraw();showPlace(p)};dot.onkeydown=e=>{if(e.key==='Enter')dot.onclick()};
 node('text',{x:Math.max(8,Math.min(288,x-15)),y:y-12,'font-size':12,fill:'#173d34'},p.name)});
 if(mapFix)node('circle',{cx:X(mapFix.longitude),cy:Y(mapFix.latitude),r:5,fill:'#147ad0',stroke:'white'});

 const complete=PLACES.slice(0,goal+1).every(configured);
 $('start').disabled=!complete||!registered;

}
async function photo(file){
 const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();
 const ratio=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,img.width*ratio);c.height=Math.max(1,img.height*ratio);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}finally{URL.revokeObjectURL(url)}
}
function commit(update,msg){
 const copy=structuredClone(routes);update(copy);
 try{localStorage.setItem(key,JSON.stringify(copy))}catch{throw Error('存储空间不足或保存受限，请换用较小的图片。')}

}
// 模型存储与表单分开，避免大文件挤占 localStorage 的点位和照片配额。
let anchorToken=0,anchorKey='',previewUrl='',dbPromise,viewerPromise;
function modelDB(){
 if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open('cq-anchor-assets',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('models');
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 }).catch(e=>{dbPromise=null;throw e});
 return dbPromise;
}
async function modelRecord(key,file){
 const db=await modelDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('models',file?'readwrite':'readonly'),store=tx.objectStore('models');
  const op=file?store.put(file,key):store.get(key);
  tx.oncomplete=()=>resolve(op.result);tx.onabort=()=>reject(tx.error||Error('模型保存失败'));
 });
}
function viewerReady(){
 if(customElements.get('model-viewer'))return Promise.resolve();
 if(!viewerPromise)viewerPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.type='module';
  script.src='https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js';
  script.onload=()=>customElements.whenDefined('model-viewer').then(resolve);
  script.onerror=()=>{script.remove();viewerPromise=null;reject(Error('三维预览加载失败，请检查网络。'))};
  document.head.append(script);
 });return viewerPromise;
}
function clearPreview(){
 $('modelBox').replaceChildren();
 if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';
}
async function preview(file,token,saveKey){
 await viewerReady();if(token!==anchorToken)return;
 clearPreview();previewUrl=URL.createObjectURL(file);
 const mv=document.createElement('model-viewer');mv.setAttribute('camera-controls','');mv.setAttribute('shadow-intensity','0.7');mv.alt='当前锚点的三维地图';
 mv.addEventListener('error',()=>{if(token===anchorToken)$('modelStatus').textContent='模型解析失败，请导出包含材质和纹理的自包含 GLB。'},{once:true});
 mv.addEventListener('load',async()=>{
  if(token!==anchorToken)return;
  try{if(saveKey)await modelRecord(saveKey,file);
   if(token===anchorToken)$('modelStatus').textContent=file.name+' · 已保存在此设备，可拖动旋转、双指缩放。';
  }catch{if(token===anchorToken)$('modelStatus').textContent='模型可预览，但设备存储不足或不可用，未保存。'}
 },{once:true});
 mv.src=previewUrl;$('modelBox').append(mv);
}
async function openAnchor(venue,index){
 const token=++anchorToken;anchorKey=venue+'/'+index;clearPreview();$('modelInput').value='';$('modelStatus').textContent='正在读取锚点模型…';
 try{const file=await modelRecord(anchorKey);if(token!==anchorToken)return;
  if(file)await preview(file,token);else $('modelStatus').textContent='上传该位置的三维地图，可在此旋转查看。';
 }catch(e){if(token===anchorToken)$('modelStatus').textContent=e.message||'设备存储不可用。'}
}
$('modelInput').onchange=async()=>{
 const file=$('modelInput').files[0];if(!file)return;
 const token=++anchorToken,key=anchorKey;
 try{const header=new DataView(await file.slice(0,12).arrayBuffer());
  if(header.byteLength!==12||header.getUint32(0,true)!==0x46546c67||header.getUint32(4,true)!==2||header.getUint32(8,true)!==file.size)throw Error('请选择有效的 GLB 2.0 文件。');
  if(token!==anchorToken)return;$('modelStatus').textContent='正在加载模型…';await preview(file,token,key);
 }catch(e){if(token===anchorToken)$('modelStatus').textContent=e.message}
};

options('venue',VENUES,site);goal=PLACES.length-1;list();
$('venue').onchange=()=>{viewport=null;follow=false;site=$('venue').selectedIndex;try{sessionStorage.setItem(key,site)}catch{}PLACES=routes[site].points;goal=PLACES.length-1;$('saved').textContent='';$('baseForm').reset();list()};
$('dest').onchange=()=>{goal=$('dest').selectedIndex;mapDraw()};$('view').onclick=()=>showPlace(PLACES[goal]);

for(const [id,label] of [['w','西边界经度'],['e','东边界经度'],['s','南界纬度'],['n','北界纬度']]){
 const l=document.createElement('label'),input=document.createElement('input');l.textContent=label;input.id='bound'+id;input.type='number';input.step='any';input.required=true;input.min='0';const horizontal='we'.includes(id);input.max=horizontal?'180':'85';
 const dir=document.createElement('select');dir.id=input.id+'Dir';dir.add(new Option(horizontal?'东经 E':'北纬 N','1'));dir.add(new Option(horizontal?'西经 W':'南纬 S','-1'));l.append(input,dir);$('bounds').append(l)}
